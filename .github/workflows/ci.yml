name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install deps
        run: pip install pytest pytest-asyncio
      - name: Run tests
        run: python -m pytest tests/ -q
        env:
          PYTEST_ADDOPTS: ""
